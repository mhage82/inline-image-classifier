name: Build master annotations

on:
  push:
    branches: [main]
    paths:
      - 'data/annotations/raw/**/*.json'
      - 'scripts/merge_annotations.py'
      - 'scripts/import_student_exports.py'
      - 'scripts/process_annotations.py'
      - 'scripts/import_reviewed_labels.py'
      - 'tests/test_merge_annotations.py'
      - 'tests/test_import_student_exports.py'
      - 'tests/test_process_annotations.py'
      - 'tests/test_reviewed_labels.py'
      - 'data/annotations/reviewed_labels.json'
      - 'data/annotations/processing_config.json'
      - 'data/annotations/adjudications.json'
      - '.github/workflows/merge-annotations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-annotations-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild and commit master JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            # This is a disposable Actions checkout. Always merge the latest raw files.
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s tests -p 'test_*.py'
            python scripts/merge_annotations.py
            python scripts/process_annotations.py
            git add data/annotations/master.json data/annotations/processed data/annotations/reports/processing_summary.json data/annotations/reports/review_queue.csv
            if git diff --cached --quiet; then
              echo 'Master JSON is already current.'
              exit 0
            fi
            git commit -m 'Update master annotations'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected; rebuilding from the latest branch (attempt $attempt)."
          done
          echo 'Unable to publish master JSON after five attempts.' >&2
          exit 1
